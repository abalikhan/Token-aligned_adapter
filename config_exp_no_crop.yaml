data:
  name: spades
  root: /project/scratch/p200249/space_data/SPADES_RGB
  input_size: 512
  sampling_rate: 4       # every 4th frame withing a video clip, ablate sampling_rate ∈ {2, 4, 8} (T ∈ {16, 8, 4})
  short_mem: 32           # 128/sampling_rate = 8 frames
  clip_stride: 21        # evenly divide sequence to 8 frames with stride 5
  crop: false # ablate on full image vs crop
  eval_use_crop: false
  num_kp: 8
  test_T_chunk: 8
  gaussian_sigma_px: 2.0 # previous best 2.0, ablate sigma_px ∈ {1.5, 2.0, 3.0, 4.0}
  train_subset: 0
  val_subset: 0
  original_size: [720, 1280]   # (H, W)
  cam_intrinsics_json: /project/scratch/p200249/space_data/SPADES_RGB/camera.json

model:
  hf_name: facebook/dinov3-vitl16-pretrain-lvd1689m
  heatmap_out: [256, 256] # best was 128, 128 
  adapter_drop: 0.1 # ablate over 0.0, 0.1, 0.2
  adapter_in_last: 8 # best with lr plateau 8 # 6 best, ablate over 8, 12, 16 
  patch_size: 16
  fuse: sum
  adapter_bottleneck: 64 #to test adapter bottleneck size 64 vs 128, ablate over 64, 128, 256/ ablate adapter placement Pre-MHSA only vs Post-MLP only vs both.
  n_register_tokens: 4
  hm_mid_c: 196 # default is 128, ablate over 256, 64

train:
  device: cuda
  epochs: 80
  batch_size: 8
  val_batch_size: 8
  num_workers: 8
  lr: 2e-4  #3.0e-4 # previous best 5.0e-4
  weight_decay: 0.05
  warmup_epochs: 5
  lr_min: 1e-6
  amp: true
  grad_clip: 0.5
  out_dir: /project/scratch/p200249/aali/pose_estimation/dinov3_temporal/outputs/spades_ad8_no_crop_vitl16
  tb_logdir: ./runs
  plateau_patience: 3
  plateau_factor: 0.3
  plateau_min_delta: 1e-4
  plateau_max_drops: 2
  resume: #./outputs/spades_hm_dsnt_ad16_256x256/best_epoch_24.pt   # or last_epoch.pt
  save_metric: total
  save_metric_mode: min

loss:
  # heatmap KL
  w_hm_frame: 1.0
  w_hm_agg: 0.05 # ablate w_hm_agg ∈ {0.0, 0.05, 0.10, 0.20}
  heatmap_target_power: 1.5 #to ablate over 1.5, 2.0 

  # keypoints (softargmax on logits)
  w_kp: 0.7 # best was 0.7, 1.0 was not good 

  # token alignment (ADAPTER TOKENS)
  w_token: 0.10 # previous best 0.15 ablate w_token ∈ {0.0, 0.05, 0.10, 0.20}
  w_token_sched:
    type: piecewise
    segments:
      - [1, 5, 0.20]
      - [6, 15, 0.10]
      - [16, 100, 0.05]

  # temperature
  tau: 0.65  # was bad 0.60, best 0.65, ablate tau = 0.70