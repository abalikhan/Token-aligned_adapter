data:
  name: spades
  root: /project/scratch/p200249/space_data/SPADES_RGB
  input_size: 512

  # temporal sampling
  sampling_rate: 4
  short_mem: 32
  clip_stride: 21

  # crop pipeline
  crop: true
  eval_use_crop: true

  # keypoints
  num_kp: 8

  # eval chunking (test loader collate)
  test_T_chunk: 8

  # heatmap target sigma in HEATMAP pixels
  gaussian_sigma_px: 2.0

  # debug subsets (0 disables)
  train_subset: 0
  val_subset: 0
  subset_mode: random      # random | first
  subset_seed: 42

  # full camera / geometry
  original_size: [720, 1280]   # (H, W) informational; code uses meta for full_hw
  cam_intrinsics_json: /project/scratch/p200249/space_data/SPADES_RGB/camera.json


model:
  # backbone
  hf_name: facebook/dinov3-vitl16-pretrain-lvd1689m
  patch_size: 16
  n_register_tokens: 4

  # heatmap head
  heatmap_out: [256, 256]
  hm_mid_c: 128

  # adapters (pre-MHSA injection in last N blocks)
  adapter_drop: 0.1
  adapter_in_last: 8
  adapter_bottleneck: 64
  fuse: sum
  ks: 3
  kt: 3

  # ===== GeoSpaceFormer: RCSA Neck =====
  neck_heads: 8
  neck_drop: 0.1

  rcsa_bins: 64              # M in code
  rcsa_neighbor_bins: 6
  rcsa_use_temporal: true
  rcsa_topk_kv: 64            # None disables topk cap
  rcsa_max_q: null            # optional cap for huge bins
  rcsa_ray_bias_scale: 0.0    # add ray similarity bias inside selected KV

  # ===== GeoSpaceFormer: KP Tokens =====
  kp_token_heads: 8
  kp_token_drop: 0.1
  kp_ray_bias_scale: 2.0      # strong default

  # ===== Optional Pose Head =====
  enable_pose_head: false     # set true to produce pred_R/pred_t (required for ADD)
  pose_hidden: 512
  # ===== Uncertainty head =====
  unc_mode: diag              # scalar | diag
  unc_hidden: 256


train:
  device: cuda
  seed: 42

  epochs: 500
  batch_size: 4
  val_batch_size: 4
  num_workers: 8

  lr: 2.5e-4
  weight_decay: 0.05
  warmup_epochs: 5
  lr_min: 1e-6

  amp: true
  grad_clip: 0.5

  out_dir: /project/scratch/p200249/aali/pose_estimation/dinov3_temporal/outputs/spades_ad8_geospace
  tb_logdir: ./runs

  # DDP
  ddp_backend: nccl

  # plateau logic (your own multiplier on top of scheduler)
  plateau_patience: 3
  plateau_factor: 0.3
  plateau_min_delta: 1e-4
  plateau_max_drops: 2

  resume: null
  save_metric: total
  save_metric_mode: min


loss:
  # heatmap KL
  w_hm_frame: 1.0
  w_hm_agg: 0.05
  heatmap_target_power: 1.5
  tau: 0.65

  # keypoint regression on DSNT mu_norm
  w_kp: 0.7

  # ADD pose loss (only if enable_pose_head=true AND w_add>0)
  w_add: 0.0                  # start at 0; set e.g. 5.0 when pose head enabled

  # token alignment (ray-consistent contrastive)
  w_token: 0.10
  token_temp: 0.07
  ray_bin_deg: 6.0
  token_t_pair: ends          # ends | random
  tok_viz_n_anchors: 6

  w_token_sched:
    type: piecewise           # none | cosine | linear | piecewise
    segments:
      - [1, 5, 0.20]
      - [6, 15, 0.10]
      - [16, 100, 0.05]


  # main weight
  w_kp_attn: 0.03            # start small: 0.01 -> 0.05 range

  # schedule: keep OFF early, turn ON after a few epochs
  w_kp_attn_sched:
    type: piecewise
    segments:
      - [1, 3, 0.0]
      - [4, 8, 0.01]
      - [9, 999, 0.03]

  # target sharpness in *input pixels*
  kp_attn_sigma_px: 12.0     # ~0.75*patch_size if patch=16; tune 8..16

  # if your model returns logits instead of probs
  kp_attn_is_logits: false

  w_nll: 1.0
  sigma_floor_px: 1.0
  sigma_floor_sched:
    type: piecewise
    segments:
      - [1, 10, 30.0]
      - [11, 30, 15.0]
      - [31, 80, 8.0]
      - [81, 999, 5.0]

  # NEW
  nll_norm_mode: diag
  nll_cap: 20.0

  w_nll_sched:
    type: piecewise
    segments:
      - [1, 5, 0.00]
      - [6, 15, 0.20]
      - [16, 50, 0.50]
      - [51, 500, 1.00]